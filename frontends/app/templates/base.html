<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sumirrorize{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block scripts %}{% endblock %}
</head>
<body>
  <header>{% block header %}SUMIRRORIZE{% endblock %}</header>

  <main>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer>
    <img class="footer-img" src="{{ url_for('static', filename='img/OurLogo.png') }}" alt="Sumirrorize logo">
  </footer>
</body>
</html>
