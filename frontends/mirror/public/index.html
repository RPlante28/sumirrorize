<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sumirrorize</title>
  <link rel="stylesheet" href="/mirror.css">
  <script src="/mirror.js" type="module"></script>
</head>
<body>
  <!-- Asks for the mirror key once per device. -->
  <section id="setup" class="screen" hidden>
    <form id="setup-form" class="setup">
      <h1>Set up this mirror</h1>
      <p>Enter the mirror key to connect this screen.</p>
      <input id="setup-key" type="password" autocomplete="off" placeholder="Mirror key" required>
      <button type="submit">Connect</button>
      <p id="setup-error" class="error" hidden></p>
    </form>
  </section>

  <!-- Until face recognition exists, choose who's at the mirror. -->
  <section id="idle" class="screen" hidden>
    <div class="idle">
      <div id="idle-time" class="idle-time"></div>
      <div id="idle-date" class="idle-date"></div>
      <p class="idle-prompt">Who's at the mirror?</p>
      <div id="people" class="people"></div>
    </div>
  </section>

  <section id="mirror" class="screen" hidden>
    <div id="widgets"></div>
    <button id="switch" class="switch" type="button">Switch person</button>
    <div id="offline" class="offline" hidden>Can't reach the server, showing older data</div>
  </section>
</body>
</html>
