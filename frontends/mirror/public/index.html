<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sumirrorize</title>
  <link rel="stylesheet" href="/mirror.css">
  <script src="/mirror.js" type="module"></script>
</head>
<body>
  <!-- Shown while nobody is recognized. -->
  <section id="idle" class="screen" hidden>
    <div class="idle">
      <div id="idle-time" class="idle-time"></div>
      <div id="idle-date" class="idle-date"></div>
      <p id="idle-hello" class="idle-hello" hidden></p>
      <p id="idle-prompt" class="idle-prompt">Step up to the mirror</p>
      <button id="camera-retry" type="button" hidden>Allow camera</button>
    </div>
  </section>

  <section id="mirror" class="screen" hidden>
    <div id="widgets"></div>
    <div id="offline" class="offline" hidden>Can't reach the server, showing older data</div>
  </section>

  <!-- The camera's live view is the background, flipped like a mirror. Frames are sent to the
       server only to recognize who's there, and aren't kept. -->
  <video id="camera" class="camera" muted playsinline></video>
</body>
</html>
