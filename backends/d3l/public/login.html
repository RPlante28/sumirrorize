<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sign in to Brightspace</title>
  <link rel="stylesheet" href="../static/login.css">
  <script src="../static/login.js" defer></script>
</head>
<body>
  <header>
    <strong>Sign in to Brightspace</strong>
    <span id="status">Connecting…</span>
  </header>
  <main id="stage">
    <canvas id="screen" tabindex="0" aria-label="Brightspace sign-in page"></canvas>
    <!-- Phones only bring up their keyboard for a real text field, so taps on the picture put the
         cursor in this invisible one (see login.js). A password field, so the keyboard doesn't
         autocorrect or remember what's typed. -->
    <input id="keys" type="password" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" enterkeyhint="go" tabindex="-1" aria-hidden="true">
    <p id="message" hidden></p>
  </main>
</body>
</html>
